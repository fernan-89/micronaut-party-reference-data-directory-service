micronaut:
  application:
    name: company-service
  server:
    port: ${SERVER_PORT:8080}
    netty:
      # SRE: Proteção contra ataques de cabeçalhos massivos
      max-header-size: 8192
      # SRE: Tuning para cargas de trabalho reativas (Event Loop)
      worker-threads: ${NETTY_WORKER_THREADS:4}
      child-options:
        SO_KEEPALIVE: true
      responses:
        # Zero-Trust: Omitir a versão do servidor nos cabeçalhos HTTP
        file:
          cache-control: "no-cache"
  router:
    versioning:
      enabled: true
      default-version: "1"

# Jackson / Serde Configuration (AOT Optimized)
jackson:
  serialization-inclusion: NON_NULL
  write-dates-as-timestamps: false
  property-naming-strategy: SNAKE_CASE

# MongoDB Reactive Configuration
mongodb:
  uri: ${MONGO_URI:mongodb://localhost:27017/company_db}
  options:
    # SRE: Configurações de pool estritas para evitar esgotamento de conexões e memory leaks
    maxConnectionIdleTime: 60000
    maxConnectionLifeTime: 3600000
    minSize: ${MONGO_MIN_POOL_SIZE:10}
    maxSize: ${MONGO_MAX_POOL_SIZE:50}
    serverSelectionTimeout: ${MONGO_SELECTION_TIMEOUT:2000} # Falha rápida (Fast-fail)

# OpenTelemetry W3C Trace Context
otel:
  sdk:
    disabled: ${OTEL_DISABLED:false}
  traces:
    exporter: otlp
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      timeout: 2000 # Timeout agressivo para não bloquear a thread em caso de falha do coletor

# External Integrations (Reactive Clients)
integrations:
  hash-service:
    url: ${HASH_SERVICE_URL:http://192.168.1.10:8080}
    # SRE: Timeouts estritos para chamadas de rede externas
    read-timeout: 2s
    connect-timeout: 1s